name: 报告问题 / Bug report
description: 数字不对、连不上、界面异常、崩溃
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认已**移除所有凭据与真实服务器地址**（API Key、IP、主机名、密钥路径）。
        日志里出现的地址可以替换成 `1.2.3.4`。

  - type: dropdown
    id: platform
    attributes:
      label: 受影响的端
      multiple: true
      options:
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 从「关于」看，或写下构建时的 commit
      placeholder: "1.0.0 / d7133be"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: "macOS 15.6 / Windows 11 23H2"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: 涉及的数据来源
      multiple: true
      options:
        - Vultr（REST API）
        - SSH + vnstat
        - 与数据来源无关（界面 / 打包 / 其他）
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际结果与你预期的结果
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开设置，添加一台 …
        2. 点「测试连接」
        3. 显示 …
    validations:
      required: true

  - type: textarea
    id: cli-output
    attributes:
      label: 诊断输出（macOS）
      description: |
        `swift run vpsquota-cli probe` 和 `swift run vpsquota-cli refresh` 的输出，
        对排查采集类问题帮助很大。**贴之前请把 IP、主机名、密钥路径脱敏。**
      render: text

  - type: textarea
    id: config
    attributes:
      label: 相关配置片段
      description: 出问题那台的配置。**去掉 sshHost、sshKeyPath 等敏感字段。**
      render: json

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已确认上面粘贴的内容不含 API Key、真实 IP、主机名或密钥路径
          required: true
        - label: 如果是「数字对不上」类问题，我已按文档核对过 meterMode 与 unitBase
          required: false
