<!-- 随包文档的内联样式。由 build-app.sh 通过 pandoc 的 -H 注入，
     不引用任何外部资源，离线可读。跟随系统深浅色。 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --border: #e3e3e6;
    --code-bg: #f5f5f7;
    --accent: #0b62d0;
    --quote-bg: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --fg: #e8e8ed;
      --muted: #98989d;
      --border: #38383c;
      --code-bg: #2a2a2e;
      --accent: #5aa9ff;
      --quote-bg: #242428;
    }
  }

  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.75 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    max-width: 780px;
    margin: 0 auto;
    padding: 44px 28px 96px;
  }

  h1, h2, h3, h4 { line-height: 1.3; font-weight: 600; }
  h1 { font-size: 1.9em; margin: 0 0 0.7em; }
  h2 {
    font-size: 1.4em;
    margin: 2.2em 0 0.8em;
    padding-bottom: 0.3em;
    border-bottom: 1px solid var(--border);
  }
  h3 { font-size: 1.15em; margin: 1.8em 0 0.6em; }
  h4 { font-size: 1em; margin: 1.5em 0 0.5em; color: var(--muted); }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  code {
    background: var(--code-bg);
    border-radius: 4px;
    padding: 0.15em 0.4em;
    font: 0.88em/1.5 "SF Mono", Menlo, Consolas, monospace;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
  }
  pre code { background: none; padding: 0; font-size: 0.86em; }

  /* 文档里表格很多（配置字段、对照表），必须清晰可读 */
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 1.2em 0;
    font-size: 0.94em;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  th { background: var(--code-bg); font-weight: 600; }
  /* 表格可能超出正文宽度，允许横向滚动而不是撑破页面 */
  .table-wrap { overflow-x: auto; }

  blockquote {
    margin: 1.2em 0;
    padding: 10px 16px;
    background: var(--quote-bg);
    border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0;
    color: var(--muted);
  }
  blockquote p:first-child { margin-top: 0; }
  blockquote p:last-child { margin-bottom: 0; }

  hr { border: none; border-top: 1px solid var(--border); margin: 2.4em 0; }
  ul, ol { padding-left: 1.6em; }
  li { margin: 0.35em 0; }
  img { max-width: 100%; }
</style>
